# ---- Kết nối Data Lake (MinIO, tương thích S3) qua S3A ----
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  minioadmin
spark.hadoop.fs.s3a.secret.key                  minioadmin123
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.fast.upload                 true

# ---- Tài nguyên: mỗi executor 1 core để thí nghiệm scale 1/2/4 core dễ kiểm soát ----
# 2 worker x (2 core, 3 GB) -> tối đa 4 executor x 1400 MB
spark.executor.cores                            1
spark.executor.memory                           1400m
spark.driver.memory                             1536m

# ---- SQL / tối ưu ----
spark.sql.adaptive.enabled                      true
spark.sql.session.timeZone                      UTC
spark.sql.sources.partitionOverwriteMode        dynamic
spark.sql.shuffle.partitions                    64
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# ---- Event log để xem lại job trên History Server (http://localhost:18080) ----
spark.eventLog.enabled                          true
spark.eventLog.dir                              file:///opt/spark-events
spark.history.fs.logDirectory                   file:///opt/spark-events
